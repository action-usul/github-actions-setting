name: output

on:
  push

jobs:
  create-output: # 작업 정의
    runs-on: ubuntu-latest # 실행 환경
    outputs:
      output: ${{ steps.check-output.outputs.test }}
    steps:
      - name: echo output # 콘솔 출력
        id: check-output # 아이디
        run: |
          echo "test=hello" >> $GITHUB_OUTPUT # 출력 파일에 출력
      - name: check output # 출력 파일에서 출력
        run: |
          echo ${{ steps.check-output.outputs.test }} # 출력 파일에서 출력

  get-output:
    runs-on: ubuntu-latest
    needs: create-output
    steps:
      - name: get output
        run: echo ${{ needs.create-output.outputs.test }}
        
