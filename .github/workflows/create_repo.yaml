name: Create Repo

on: 
  workflow_dispatch:
    inputs:

      prefix:
        description: "Prefix for the repo name"
        required: true
        default: "service"
        type: choice
        options:
          - example
          - service
          
      name:
        description: "Name for the repo"
        required: true
        default: "github-actions"
        type: string

jobs:
  create-repo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: gh auth login
        run: |
          echo ${{ secrets.PERSONAL_ACCESS_TOKEN }} | gh auth login --with-token

      - name: Create Repo
        id: create-repo
        run: |
          gh repo create action-usul/${{ inputs.prefix }}-${{ inputs.name }} --public --add-readme
      
      - name: slack notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "attachments": [
                {
                  "pretext": "create repo result",
                  "color": "28a745",
                  "fields": [
                    {
                      "title": "create repo results: ${{ steps.create-repo.outcome }}",
                      "value": "${{ inputs.prefix }}-${{ inputs.name }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
          webhook-type: incoming-webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

